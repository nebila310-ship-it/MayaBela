  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();

      document.getElementById("splash-halo")?.remove();
      document.getElementById("splash-loader-wrap")?.remove();
      document.body.style.background = "transparent";
    }
    window.addEventListener('flutter-first-frame', removeSplashFromWeb);
    (function watchFlutterThenDropSplash() {
      if (document.querySelector('flt-glass-pane, flutter-view')) {
        removeSplashFromWeb();
        return;
      }
      var obs = new MutationObserver(function () {
        if (document.querySelector('flt-glass-pane, flutter-view')) {
          removeSplashFromWeb();
          obs.disconnect();
        }
      });
      obs.observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>

  <script>
    (function milestoneSpinner() {
      var ring = document.getElementById('mile-spin');
      var cap = document.getElementById('mile-cap');
      if (!ring || !cap) return;
      var colors = ['#C2185B','#E37400','#F9AB00','#1E8E3E','#00897B','#12B5CB','#1A73E8','#6A1B9A'];
      var sets = ['ABCDEFGH'.split(''), '12345678'.split('')];
      var step = 0;
      function showSet(chars) {
        cap.classList.remove('is-on');
        ring.innerHTML = chars.map(function (ch, i) {
          var turn = (360 / chars.length) * i;
          return '<span class="mile-arm" style="transform:rotate(' + turn + 'deg)">' +
            '<span class="mile-glyph" style="color:' + colors[i] + '">' + ch + '</span></span>';
        }).join('');
        ring.classList.remove('is-running');
        void ring.offsetWidth;
        ring.classList.add('is-running');
      }
      function showCap() {
        ring.classList.remove('is-running');
        ring.innerHTML = '';
        cap.classList.remove('is-on');
        void cap.offsetWidth;
        cap.classList.add('is-on');
      }
      function loop() {
        if (!document.getElementById('splash')) return;
        if (step < sets.length) {
          showSet(sets[step]);
          step += 1;
          setTimeout(loop, 2500);
        } else {
          showCap();
          step = 0;
          setTimeout(loop, 1300);
        }
      }
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        showSet(sets[0]);
        cap.classList.add('is-on');
        return;
      }
      loop();
    })();
  </script>
  <script>
    (function applySavedSchoolSplash() {
      try {
        function readLastSchoolId() {
          var direct = (localStorage.getItem('mayabela_last_school_id') || '').trim();
          if (direct) return direct.toUpperCase();
          var flutter = localStorage.getItem('flutter.login_last_school_id');
          if (!flutter) return '';
          try {
            var parsed = JSON.parse(flutter);
            return (parsed || '').toString().trim().toUpperCase();
          } catch (e) {
            return flutter.replace(/^"+|"+$/g, '').trim().toUpperCase();
          }
        }
        var lastId = readLastSchoolId();
        if (!lastId) return;
        var brand = null;
        try {
          var allRaw = localStorage.getItem('mayabela_school_brands');
          if (allRaw) {
            var all = JSON.parse(allRaw);
            if (all && all[lastId]) brand = all[lastId];
          }
        } catch (e) {}
        if (!brand) {
          var raw = localStorage.getItem('mayabela_school_splash');
          if (!raw) return;
          brand = JSON.parse(raw);
          var brandId = (brand.schoolId || '').toString().trim().toUpperCase();
          if (brandId && brandId !== lastId) return;
        }
        var picture = document.getElementById('splash');
        var img = picture && picture.querySelector('img');
        var src = brand.dataUrl || brand.logoUrl;
        if (img && src) {
          var sources = picture.querySelectorAll('source');
          for (var i = 0; i < sources.length; i++) sources[i].remove();
          img.removeAttribute('srcset');
          img.dataset.toned = '';
          img.classList.remove('needs-multiply');
          img.src = src;
          img.onerror = function () {
            img.onerror = null;
            img.dataset.toned = '';
            img.classList.remove('needs-multiply');
            img.src = 'splash/img/light-3x.png';
            img.style.borderRadius = '';
            img.addEventListener('load', function () { toneSplashMark(img); }, { once: true });
          };
          img.style.objectFit = 'contain';
          img.classList.add('watermark');
          if (brand.logoStyle === 'circular') {
            img.style.borderRadius = '24%';
          }
        }
        var nameEl = document.getElementById('splash-school-name');
        if (nameEl && brand.name) {
          nameEl.textContent = brand.name;
          nameEl.style.display = 'block';
        }
        if (brand.name) {
          document.title = brand.name;
          var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (appleTitle) appleTitle.setAttribute('content', brand.name);
        }
        var iconSrc = brand.dataUrl || brand.logoUrl;
        if (iconSrc) {
          var iconLinks = document.querySelectorAll('link[rel="icon"], link[rel="shortcut icon"], link[rel="apple-touch-icon"]');
          for (var i = 0; i < iconLinks.length; i++) {
            iconLinks[i].setAttribute('href', iconSrc);
            if (iconSrc.indexOf('data:image') === 0) {
              iconLinks[i].setAttribute('type', 'image/jpeg');
            }
          }
        }
      } catch (e) {}
      finally {
        toneSplashMark(document.getElementById('splash-mark'));
      }
    })();

    function toneSplashMark(img) {
      if (!img || img.dataset.toned === '1') return;
      if (!img.complete || !img.naturalWidth) {
        img.addEventListener('load', function () { toneSplashMark(img); }, { once: true });
        return;
      }
      try {
        var max = 1024;
        var scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        var canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
        var ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        var image = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var p = image.data;
        var clear = 0;
        var samples = 0;
        for (var s = 3; s < p.length; s += 16) {
          samples += 1;
          if (p[s] < 250) clear += 1;
        }
        if (samples && clear / samples > 0.08) {
          img.dataset.toned = '1';
          return;
        }
        for (var i = 0; i < p.length; i += 4) {
          var r = p[i], g = p[i + 1], b = p[i + 2];
          var hi = r > g ? (r > b ? r : b) : (g > b ? g : b);
          var lo = r < g ? (r < b ? r : b) : (g < b ? g : b);
          if ((hi - lo) < 58 && lo > 196) {
            p[i + 3] = 0;
            continue;
          }
          p[i] = (r * 0.78) | 0;
          p[i + 1] = (g * 0.78) | 0;
          p[i + 2] = (b * 0.78) | 0;
        }
        ctx.putImageData(image, 0, 0);
        img.dataset.toned = '1';
        img.classList.remove('needs-multiply');
        img.removeAttribute('srcset');
        img.src = canvas.toDataURL('image/png');
      } catch (e) {
        img.dataset.toned = '1';
        img.classList.add('needs-multiply');
      }
    }

      function currentScale() {
