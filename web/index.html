  <style id="splash-screen-style">
    html {
      height: 100%;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      min-height: 100%;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      overscroll-behavior-x: none;
      background-color: #FFFFFF;
          background-size: 100% 100%;
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    /* iOS Safari zooms the page when a focused input is under 16px.
       Flutter then swallows pinch, so logout and other buttons cannot be tapped. */
    input, textarea, select,
    input.flt-text-editing,
    textarea.flt-text-editing,
    .flt-text-editing {
      font-size: 16px !important;
      touch-action: manipulation;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #ffffff;
      pointer-events: none;
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    #splash-halo {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 268px;
      height: 268px;
      margin: 0;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 3;
    }

    .splash-orbit {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        #00897B,
        #12B5CB,
        #1A73E8,
        #8E24AA,
        #C2185B,
        #E37400,
        #F9AB00,
        #1E8E3E,
        #00897B
      );
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
      animation: splash-spin 1.2s linear infinite, splash-hue 3.6s linear infinite;
    }

    .splash-orbit-inner {
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      background: conic-gradient(
        from 180deg,
        #F9AB00,
        #1A73E8,
        #C2185B,
        #12B5CB,
        #1E8E3E,
        #F9AB00
      );
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
      animation: splash-spin-rev 1.75s linear infinite, splash-hue 4.8s linear infinite reverse;
    }

    .splash-bead {
      position: absolute;
      top: 0;
      left: 50%;
      width: 12px;
      height: 12px;
      margin-left: -6px;
      border-radius: 50%;
      background: #12B5CB;
      box-shadow: 0 0 10px #12B5CB;
      transform-origin: 6px 134px;
      animation: splash-spin 1.2s linear infinite, splash-bead 2.6s linear infinite;
    }

    #splash-loader-wrap {
      position: absolute;
      top: calc(50% + 190px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 4;
      pointer-events: none;
      width: 90%;
    }

    #splash-loading-label {
      margin: 0;
      font: 700 13px/1.2 system-ui, Segoe UI, sans-serif;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      background: linear-gradient(
        90deg,
        #00897B,
        #1A73E8,
        #8E24AA,
        #E37400,
        #1E8E3E,
        #00897B
      );
      background-size: 240% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: splash-label 2.8s linear infinite;
    }

    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes splash-spin-rev {
      to { transform: rotate(-360deg); }
    }

    @keyframes splash-hue {
      to { filter: hue-rotate(360deg); }
    }

    @keyframes splash-bead {
      0% { background: #12B5CB; box-shadow: 0 0 10px #12B5CB; }
      25% { background: #8E24AA; box-shadow: 0 0 10px #8E24AA; }
      50% { background: #E37400; box-shadow: 0 0 10px #E37400; }
      75% { background: #1E8E3E; box-shadow: 0 0 10px #1E8E3E; }
      100% { background: #12B5CB; box-shadow: 0 0 10px #12B5CB; }
    }

    @keyframes splash-label {
      to { background-position: 240% 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-orbit,
      .splash-orbit-inner,
      .splash-bead,
      #splash-loading-label {
        animation: none;
      }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.getElementById("splash-school-name")?.remove();
      document.getElementById("splash-halo")?.remove();
      document.getElementById("splash-loader-wrap")?.remove();
      document.body.style.background = "transparent";
    }
    window.addEventListener('flutter-first-frame', removeSplashFromWeb);
    (function watchFlutterThenDropSplash() {
      if (document.querySelector('flt-glass-pane, flutter-view')) {
        removeSplashFromWeb();
        return;
      }
      var obs = new MutationObserver(function () {
        if (document.querySelector('flt-glass-pane, flutter-view')) {
          removeSplashFromWeb();
          obs.disconnect();
        }
      });
      obs.observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>

  <script>
    (function applySavedSchoolSplash() {
      try {
        function readLastSchoolId() {
          var direct = (localStorage.getItem('mayabela_last_school_id') || '').trim();
          if (direct) return direct.toUpperCase();
          var flutter = localStorage.getItem('flutter.login_last_school_id');
          if (!flutter) return '';
          try {
            var parsed = JSON.parse(flutter);
            return (parsed || '').toString().trim().toUpperCase();
          } catch (e) {
            return flutter.replace(/^"+|"+$/g, '').trim().toUpperCase();
          }
        }
        var lastId = readLastSchoolId();
        if (!lastId) return;
        var raw = localStorage.getItem('mayabela_school_splash');
        if (!raw) return;
        var brand = JSON.parse(raw);
        var brandId = (brand.schoolId || '').toString().trim().toUpperCase();
        if (brandId && brandId !== lastId) return;
        var picture = document.getElementById('splash');
        var img = picture && picture.querySelector('img');
        var src = brand.dataUrl || brand.logoUrl;
        if (img && src) {
          var sources = picture.querySelectorAll('source');
          for (var i = 0; i < sources.length; i++) sources[i].remove();
          img.removeAttribute('srcset');
          img.src = src;
          img.style.maxWidth = '240px';
          img.style.maxHeight = '240px';
          img.style.objectFit = 'cover';
          if (brand.logoStyle === 'circular') {
            img.style.borderRadius = '50%';
            img.style.width = '160px';
            img.style.height = '160px';
          }
        }
        var nameEl = document.getElementById('splash-school-name');
        if (nameEl && brand.name) {
          nameEl.textContent = brand.name;
          nameEl.style.display = 'block';
        }
        if (brand.name) {
          document.title = brand.name;
          var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (appleTitle) appleTitle.setAttribute('content', brand.name);
        }
        var iconSrc = brand.dataUrl || brand.logoUrl;
        if (iconSrc) {
          var iconLinks = document.querySelectorAll('link[rel="icon"], link[rel="shortcut icon"], link[rel="apple-touch-icon"]');
          for (var i = 0; i < iconLinks.length; i++) {
            iconLinks[i].setAttribute('href', iconSrc);
            if (iconSrc.indexOf('data:image') === 0) {
              iconLinks[i].setAttribute('type', 'image/jpeg');
            }
          }
        }
      } catch (e) {}
    })();
  </script>
  
  
  
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    (function () {
      var meta = document.querySelector('meta[name="viewport"]');
      if (!meta) return;
      var locked =
        'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover';
      var relaxed =
        'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, viewport-fit=cover';
      function currentScale() {
        return window.visualViewport ? window.visualViewport.scale : 1;
      }
      function restoreScale() {
        if (currentScale() <= 1.01) {
          meta.setAttribute('content', locked);
          return;
        }
        // iOS only unsticks an existing zoom if maximum-scale is toggled.
        meta.setAttribute('content', locked);
        setTimeout(function () {
          meta.setAttribute('content', relaxed);
          setTimeout(function () {
            meta.setAttribute('content', locked);
          }, 50);
        }, 50);
        try { window.scrollTo(0, 0); } catch (e) {}
      }
      function isFormField(el) {
        if (!el || !el.tagName) return false;
        var tag = String(el.tagName).toLowerCase();
        return tag === 'input' || tag === 'textarea' || tag === 'select';
      }
      document.addEventListener('focusin', function (e) {
        if (isFormField(e.target)) meta.setAttribute('content', locked);
      }, true);
      document.addEventListener('focusout', restoreScale, true);
      document.addEventListener('touchstart', function (e) {
        if (currentScale() <= 1.01) return;
        if (isFormField(e.target)) return;
        restoreScale();
      }, { passive: true });
      window.addEventListener('orientationchange', restoreScale);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function () {
          if (currentScale() <= 1.01) return;
          if (isFormField(document.activeElement)) return;
          restoreScale();
        });
      }
    })();
  </script>
