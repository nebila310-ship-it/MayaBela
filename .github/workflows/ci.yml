# Flutter tests on PR / push. Deploy workflow stays separate.
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether Flutter tests are needed
        id: gate
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE" 2>/dev/null || true
          CHANGED=$(git diff --name-only "$BASE"...HEAD || git diff --name-only "$BASE" HEAD || true)
          echo "Changed files:"
          echo "$CHANGED"
          if [ -z "$CHANGED" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$CHANGED" | grep -vE '^\.github/' | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip Flutter tests (workflow-only change)
        if: steps.gate.outputs.run != 'true'
        run: echo "Only .github files changed — Flutter tests skipped."

      - name: Setup Flutter
        if: steps.gate.outputs.run == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        if: steps.gate.outputs.run == 'true'
        run: flutter pub get

      - name: Static analysis
        if: steps.gate.outputs.run == 'true'
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        if: steps.gate.outputs.run == 'true'
        run: flutter test --reporter expanded

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check security Edge Functions
        run: deno check supabase/functions/platform-owner-pin/index.ts supabase/functions/school-upsert-account/index.ts

      - name: Test platform PIN hashing
        run: deno test supabase/functions/_shared/platform_pin_test.ts

  # Live PostgREST negatives against the disposable staging project only.
  # Skips when staging secrets or the destructive-test opt-in are absent.
  # Never runs against production (hwkiihonthueadbhcvfi).
  rls-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: RLS isolation (parent / other school must fail)
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
          STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
          RLS_TEST_PROJECT_REF: ${{ vars.RLS_TEST_PROJECT_REF }}
          ALLOW_DESTRUCTIVE_RLS_TESTS: ${{ vars.ALLOW_DESTRUCTIVE_RLS_TESTS }}
        run: |
          if [ -z "$STAGING_SUPABASE_URL" ] || [ -z "$STAGING_ANON_KEY" ] || [ -z "$STAGING_SERVICE_ROLE_KEY" ]; then
            echo "RLS isolation skipped — staging secrets are not configured."
            exit 0
          fi
          # The last green CI run took this skip. Failing here makes the job
          # red until someone adds staging secrets. Production is still refused
          # below and inside tools/test_rls_isolation.mjs.
          DISPOSABLE_REF="bfpcpgxekzdqxuxvajuy"
          PROD_REF="hwkiihonthueadbhcvfi"
          if [ -z "$RLS_TEST_PROJECT_REF" ]; then
            RLS_TEST_PROJECT_REF="$(printf '%s' "$STAGING_SUPABASE_URL" | sed -n 's#^https://\([a-z0-9]\{20\}\)\.supabase\.co/*$#\1#p')"
            export RLS_TEST_PROJECT_REF
          fi
          if [ "$RLS_TEST_PROJECT_REF" = "$PROD_REF" ]; then
            echo "ERROR: refusing to run RLS isolation against production."
            exit 1
          fi
          if [ -z "$ALLOW_DESTRUCTIVE_RLS_TESTS" ]; then
            if [ "$RLS_TEST_PROJECT_REF" = "$DISPOSABLE_REF" ]; then
              export ALLOW_DESTRUCTIVE_RLS_TESTS=YES
            else
              echo "RLS isolation skipped — set RLS_TEST_PROJECT_REF and ALLOW_DESTRUCTIVE_RLS_TESTS=YES for this staging project."
              exit 0
            fi
          fi
          if [ -z "$RLS_TEST_PROJECT_REF" ]; then
            echo "ERROR: STAGING_SUPABASE_URL is not a canonical https://<project-ref>.supabase.co URL."
            exit 1
          fi
          node tools/test_rls_isolation.mjs
