# Deploy password-reset edge functions to the live Supabase project.
# One GitHub secret is required:
#   SUPABASE_ACCESS_TOKEN — https://supabase.com/dashboard/account/tokens
#
# Without that secret the live Reset Password page keeps returning
# "email reset is not configured".

name: Deploy reset email functions

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "supabase/functions/school-request-password-reset/**"
      - "supabase/functions/school-submit-application/**"
      - "supabase/functions/school-invite-parent/**"
      - "supabase/functions/school-request-student-password-reset/**"
      - "supabase/functions/school-confirm-password-reset/**"
      - "supabase/functions/school-upsert-account/**"
      - "supabase/functions/school-register-parent/**"
      - "supabase/functions/school-upsert-registry/**"
      - "supabase/functions/school-change-password/**"
      - "supabase/functions/platform-mail-config/**"
      - "supabase/functions/_shared/mailer.ts"
      - "supabase/functions/_shared/school_auth.ts"
      - "supabase/functions/_shared/cors.ts"
      - ".github/workflows/deploy-edge-functions.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy reset functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add GitHub Actions secret SUPABASE_ACCESS_TOKEN (Supabase dashboard → Account → Access Tokens). Until then the live Reset Password page cannot send mail."
            exit 1
          fi
          REF=hwkiihonthueadbhcvfi
          supabase functions deploy school-request-password-reset --project-ref "$REF" --no-verify-jwt
          supabase functions deploy school-submit-application --project-ref "$REF" --no-verify-jwt
          supabase functions deploy school-invite-parent --project-ref "$REF" --no-verify-jwt
          supabase functions deploy school-request-student-password-reset --project-ref "$REF" --no-verify-jwt
          supabase functions deploy school-confirm-password-reset --project-ref "$REF" --no-verify-jwt
          supabase functions deploy school-upsert-account --project-ref "$REF" --no-verify-jwt
          supabase functions deploy school-register-parent --project-ref "$REF" --no-verify-jwt
          supabase functions deploy school-upsert-registry --project-ref "$REF" --no-verify-jwt
          supabase functions deploy school-change-password --project-ref "$REF" --no-verify-jwt
          supabase functions deploy platform-mail-config --project-ref "$REF" --no-verify-jwt
