# Publish the Fenote Raey meeting deck as a real website (opens in the browser).
# URL: https://nebila310-ship-it.github.io/MayaBela/

name: Fenote Raey slides (GitHub Pages)

on:
  push:
    branches:
      - cursor/final-decision-presentation-0f33
      - master
      - main
    paths:
      - "docs/presentations/final-decision/**"
      - ".github/workflows/fenote-raey-slides-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fenote-raey-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages" -f build_type=workflow || true
          gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow || true

      - name: Configure Pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble static site
        run: |
          mkdir -p _site/screens
          cp docs/presentations/final-decision/index.html _site/index.html
          cp docs/presentations/final-decision/leave-behind.html _site/leave-behind.html
          cp docs/presentations/final-decision/screens/*.png _site/screens/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Pages enablement hint
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "GitHub Pages is not enabled on this repo yet."
          echo "Turn it on at https://github.com/${{ github.repository }}/settings/pages"
          echo "Source: GitHub Actions. Then re-run this workflow."
