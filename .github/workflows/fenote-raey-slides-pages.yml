# Publish the Fenote Raey meeting deck as a real website (opens in the browser).
# URL: https://nebila310-ship-it.github.io/MayaBela/

name: Fenote Raey slides (GitHub Pages)

on:
  push:
    branches:
      - cursor/final-decision-presentation-0f33
      - master
      - main
    paths:
      - "docs/presentations/final-decision/**"
      - ".github/workflows/fenote-raey-slides-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fenote-raey-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          mkdir -p _site/screens
          cp docs/presentations/final-decision/index.html _site/index.html
          cp docs/presentations/final-decision/leave-behind.html _site/leave-behind.html
          cp docs/presentations/final-decision/screens/*.png _site/screens/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
