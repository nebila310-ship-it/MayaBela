org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.configuration-cache=false
android.useAndroidX=true
# Avoid Kotlin classpath snapshot crashes on plugin jars (firebase_auth, etc.)
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
# Stay on AGP 8.12 (see settings.gradle.kts). Keep built-in Kotlin / new DSL off so
# plugins that still apply kotlin-android (add_2_calendar) keep compiling.
android.builtInKotlin=false
android.newDsl=false
