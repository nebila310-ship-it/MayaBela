org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.parallel=false
android.useAndroidX=true
# Avoid Kotlin classpath snapshot crashes on plugin jars (firebase_auth, etc.)
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
# Flutter 3.44.8 still needs legacy DSL; AGP 9 built-in Kotlin + newDsl breaks Flutter casts.
# Patched Flutter gradle whenEvaluated() avoids afterEvaluate crash with these flags.
android.builtInKotlin=false
android.newDsl=false
